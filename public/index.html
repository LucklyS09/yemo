  <title>墨夜 · 小说创作空间</title>
  <script>
    (function () {
      try {
        var root = document.documentElement;
        var scheme = localStorage.getItem('ink.scheme');
        var accent = localStorage.getItem('ink.accent');
        if (scheme === 'light' || scheme === 'dark') root.dataset.scheme = scheme;
        if (accent === 'jade' || accent === 'blue' || accent === 'red' || accent === 'amber') root.dataset.accent = accent;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', root.dataset.scheme === 'light' ? '#f3f0e8' : '#06070b');
      } catch (error) { /* localStorage can be unavailable */ }
    })();
  </script>
